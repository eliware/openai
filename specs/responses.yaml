version: 12.0.0
title: Responses transport contract
status: active
requirements:
  - "HTTP remains the default transport; WebSocket transport is selected with
    transport: websocket."
  - Apply custom WebSocket URLs and constructors to the initial connection.
  - A WebSocket client accepts one in-flight response request and rejects
    concurrent requests explicitly.
  - WebSocket reconnect is not performed; interruption fails the active request
    rather than replaying it.
  - Abort signals settle active requests deterministically, and close is
    awaitable and bounded.
  - Protocol events preserve raw event data and available response and request
    identifiers; terminal failures reject with ResponsesError.
  - Browser-native WebSocket constructors and the responses-ws alias are
    unsupported.
