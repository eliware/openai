name: npm publication

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.repository }}-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify package version
        shell: bash
        run: test "$(npm pkg get version --raw)" = "${GITHUB_REF_NAME#v}"
      - run: npm publish --access public --provenance
      - name: Verify package publication
        run: test "$(npm view "@eliware/openai@${GITHUB_REF_NAME#v}" version)" = "${GITHUB_REF_NAME#v}"
